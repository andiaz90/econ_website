[build]
command = "hugo --gc --minify -b $URL"
publish = "public"

[context.production.environment]
HUGO_VERSION = "0.119.0"
HUGO_ENV = "production"
HUGO_ENABLEGITINFO = "true"

[context.split1]
command = "hugo --gc --minify --enableGitInfo"

[context.split1.environment]
HUGO_VERSION = "0.119.0"
HUGO_ENV = "production"

[context.deploy-preview]
command = "hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL"

[context.deploy-preview.environment]
HUGO_VERSION = "0.119.0"

[context.branch-deploy]
command = "hugo --gc --minify -b $DEPLOY_PRIME_URL"

[context.branch-deploy.environment]
HUGO_VERSION = "0.119.0"

[context.next.environment]
HUGO_ENABLEGITINFO = "true"

[[redirects]]
from = "/npmjs/*"
to = "/npmjs/"
status = 200

[[redirects]]
from = "/publication/figi/*"
to = "/policy/figi/"
status = 301

[[redirects]]
from = "/publication/jmp/*"
to = "/working-papers/jmp/"
status = 301

[[redirects]]
from = "/publication/parental_altruism/*"
to = "/working-papers/parental_altruism/"
status = 301

[[redirects]]
from = "/publication/"
to = "/working-papers/"
status = 301

# Old URLs still indexed by Google -> current pages (added 2026-10-15)
